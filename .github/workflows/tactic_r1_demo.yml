name: Tactic R1 isolated demo verification

on:
  push:
    branches:
      - 'feat/tactic-terminal-r1-shell-01'

permissions:
  contents: read

concurrency:
  group: tactic-r1-demo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  demo-only:
    if: github.repository == 'Jorgeprdz/NewTermux'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TERMUX_PACKAGE_VARIANT: apt-android-7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and one isolated demo build (never assembleDebug)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDemoUnitTest :app:assembleDemo --no-daemon
      - name: Verify APK identity before publishing a workflow artifact
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/demo -maxdepth 1 -name '*.apk' -type f)
          test "${#apks[@]}" -gt 0
          aapt_path="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$aapt_path"
          for apk in "${apks[@]}"; do
            "$aapt_path" dump badging "$apk" | grep -q "package: name='com.termux.demo'"
            sha256sum "$apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tactic-terminal-r1-coexist-demo
          path: app/build/outputs/apk/demo/*.apk
          if-no-files-found: error
          retention-days: 7
